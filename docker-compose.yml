version: '3.8'

services:
  backend:
    container_name: vanshtiwari1404-backend
    image: vanshtiwari1404/axiom-backend:latest
    build:
      context: .
      dockerfile: Backend/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    container_name: vanshtiwari1404-frontend
    image: vanshtiwari1404/axiom-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
