<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxiomAI · Chat Interface</title>
    <link rel="icon" href="axiom_visual1.png" type="image/png">
    <link href="index.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon-wrapper">
                        <div class="logo-icon">AI</div>
                        <div class="logo-glow"></div>
                    </div>
                    <span class="logo-text">AxiomAI</span>
                </div>
            </div>

            <div class="sidebar-visual-top">
                <img src="axiom_visual1.png" alt="AxiomAI" class="sidebar-image">
            </div>

            <div class="sidebar-section">
                <button class="new-chat-btn" onclick="newChat()">
                    <span>+ New Chat</span>
                </button>
            </div>

            <div class="creator-footer">
                Created by Vansh Tiwari
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="chat-header">
                <div class="chat-title">
                    <span class="status-dot"></span>
                    AxiomAI 1.0
                </div>
                <div class="header-actions">
                    <button class="icon-btn" title="Settings">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </button>
                    <button class="icon-btn" title="Clear" onclick="newChat()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-visual">
                        <div class="sphere"></div>
                        <div class="ring"></div>
                    </div>
                    <h1 class="empty-state-title">AxiomAI</h1>
                    <p class="empty-state-subtitle">A Modular AI-Powered Conversational System</p>
                    <div class="suggestion-chips">
                        <div class="suggestion-chip" onclick="fillPrompt('Explain quantum computing concepts')">
                            <div class="chip-icon">⚛️</div>
                            <div class="chip-content">
                                <strong>Explain</strong>
                                <span>Quantum computing concepts</span>
                            </div>
                        </div>
                        <div class="suggestion-chip" onclick="fillPrompt('Write a creative sci-fi story')">
                            <div class="chip-icon">🚀</div>
                            <div class="chip-content">
                                <strong>Create</strong>
                                <span>A creative sci-fi story</span>
                            </div>
                        </div>
                        <div class="suggestion-chip" onclick="fillPrompt('Help me debug this code')">
                            <div class="chip-icon">🐛</div>
                            <div class="chip-content">
                                <strong>Debug</strong>
                                <span>My programming code</span>
                            </div>
                        </div>
                        <div class="suggestion-chip" onclick="fillPrompt('Design a workout plan')">
                            <div class="chip-icon">💪</div>
                            <div class="chip-content">
                                <strong>Design</strong>
                                <span>A fitness workout plan</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea class="input-box" id="messageInput" placeholder="Message..." rows="1"
                        onkeydown="handleKeyPress(event)" oninput="adjustTextareaHeight(this)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    AxiomAI Model V2.4 · Data may be unverified
                </div>
            </div>
        </main>
    </div>

    <script>
        // GSAP Animations
        document.addEventListener('DOMContentLoaded', () => {
            // Animate Sidebar Elements
            gsap.from(".sidebar", { x: -50, opacity: 0, duration: 0.8, ease: "power3.out" });
            gsap.from(".logo", { y: -20, opacity: 0, delay: 0.2, duration: 0.6 });
            gsap.from(".new-chat-btn", { y: 10, opacity: 0, delay: 0.4, duration: 0.4 });
            gsap.from(".history-item", { x: -20, opacity: 0, stagger: 0.1, delay: 0.5 });
            gsap.from(".folder-item", { x: -20, opacity: 0, stagger: 0.1, delay: 0.8 });

            // Animate footer
            gsap.from(".creator-footer", { opacity: 0, duration: 1, delay: 1 });

            // Globe/Sphere Animation
            gsap.to(".globe-grid", { rotation: 360, duration: 20, repeat: -1, ease: "linear" });

            // Main Content
            gsap.from(".empty-state-visual", { scale: 0.8, opacity: 0, duration: 1, ease: "back.out(1.7)", delay: 0.5 });
        });

        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const emptyState = document.getElementById('emptyState');
        let messageCount = 0;

        // Enable send button when there's text
        messageInput.addEventListener('input', () => {
            sendBtn.disabled = messageInput.value.trim() === '';
        });

        // Auto-resize textarea
        function adjustTextareaHeight(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Fill prompt from suggestion
        function fillPrompt(text) {
            messageInput.value = text;
            messageInput.focus();
            sendBtn.disabled = false;
            adjustTextareaHeight(messageInput);
        }

        // Send message
        // using relative path so it works on localhost, EC2, etc. via Nginx proxy
        const API_URL = "/chat";

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            if (emptyState) {
                emptyState.style.display = "none";
            }

            addMessage("user", message);

            messageInput.value = "";
            messageInput.style.height = "auto";
            sendBtn.disabled = true;

            const typingId = addTypingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question: message })
                });

                if (!response.ok) {
                    throw new Error("Server error");
                }

                const data = await response.json();

                removeTypingIndicator(typingId);
                addMessage("ai", data.answer || "⚠️ Empty response from model.");

            } catch (error) {
                removeTypingIndicator(typingId);
                addMessage("ai", "⚠️ Backend connection failed.");
                console.error(error);
            }
        }


        // Add message to chat
        function addMessage(role, content) {
            messageCount++;
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;

            const isUser = role === 'user';

            // Minimalist avatars
            const avatar = isUser ? 'You' : 'AI';

            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="message-avatar ${role}-avatar">${isUser ? 'U' : 'AI'}</div>
                    <div class="message-role">${isUser ? 'You' : 'AxiomAI'}</div>
                </div>
                <div class="message-content">${formatMessage(content)}</div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Animate new message
            gsap.from(messageDiv, { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" });
        }

        // Format message with markdown-like formatting
        function formatMessage(text) {
            // Simple formatting: **bold**, *italic*, `code`
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }

        // Add typing indicator
        function addTypingIndicator() {
            const typingId = 'typing-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai-message';
            messageDiv.id = typingId;

            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="message-avatar ai-avatar">AI</div>
                    <div class="message-role">AxiomAI</div>
                </div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return typingId;
        }

        // Remove typing indicator
        function removeTypingIndicator(typingId) {
            const typingElement = document.getElementById(typingId);
            if (typingElement) {
                // Fade out before removing
                gsap.to(typingElement, { opacity: 0, height: 0, duration: 0.3, onComplete: () => typingElement.remove() });
            }
        }

        // New chat
        function newChat() {
            // Animate transition out maybe?
            location.reload();
        }

        // Focus input on load
        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
</body>

</html>
